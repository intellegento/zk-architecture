server {
    server_name value.staging.trixcode.io www.value.staging.trixcode.io;
    listen 443 ssl;

    index index.html index.htm index.nginx-debian.html;

    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/html text/plain text/css text/javascript application/javascript image/svg+xml image/png image/gif i>

    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    
    # Logs
    access_log /var/log/nginx/VALUE-access.log;
    error_log /var/log/nginx/VALUE-error.log;

    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://value.frontend;
    }
    location /static {
        proxy_cache STATIC;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 60m;
        proxy_pass http://value.frontend;
    }
    location / {
        proxy_pass http://value.frontend;
    }
    ssl_certificate /etc/letsencrypt/live/pentapay.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pentapay.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name value.staging.trixcode.io;
    return 301 https://value.staging.trixcode.io$request_uri;
    listen 443 ssl; # managed by Certbot
}

server {
    if ($host = value.staging.trixcode.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name value.staging.trixcode.io;
    return 404; # managed by Certbot
}